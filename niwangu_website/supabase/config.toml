project_id = "niwangu"

# Only signed-in members may start a payment. The function additionally resolves
# the caller's profile from the token rather than the request body.
[functions.paystack-charge]
enabled = true
verify_jwt = true

# Paystack cannot send a JWT. This one authenticates with the HMAC SHA-512
# signature in x-paystack-signature and verifies the transaction against
# Paystack's API instead.
[functions.paystack-webhook]
enabled = true
verify_jwt = false

[functions.delete-account]
enabled = true
verify_jwt = true
